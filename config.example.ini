[video]
; direct = SteamVR owns the Rokid display, extended = desktop compositor window,
; virtual = IVRVirtualDisplay + D3D11 presenter
path=extended
output_mode=auto
vsync=1
swap_eyes=0

[hmd]
ipd_tenths_mm=630
; 100, 125, 150, or 200. Applies to yaw/pitch only; roll remains 1:1.
view_gain_percent=100

[input]
; Experimental Vive-style pointer for SteamVR Dashboard. Keep disabled for
; simulators that use the native Windows mouse and keyboard.
virtual_controller=0

[display]
; Optional persistent DISPLAYCONFIG monitor device path.
id=

[game]
name=War Thunder
executable=
arguments=
working_directory=
