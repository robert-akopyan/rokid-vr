name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build and test
        run: |
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          $version = if ($ref -match '^v(\d+\.\d+\.\d+(?:\.\d+)?)$') { $Matches[1] } else { '0.1.5' }
          & '${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$version" installer\RokidVR.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RokidVR-Windows-Installer
          path: build/installer/RokidVR-Setup-*.exe

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/installer/RokidVR-Setup-*.exe
          generate_release_notes: true
